[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncbi-dataset-builder"
version = "0.1.0"
description = "Workspace-first, sample-streaming dataset construction from NCBI data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "polars>=1.0",
]

[project.optional-dependencies]
progress = [
  "tqdm>=4.66",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[project.scripts]
ncbi-dataset = "ncbi_dataset_builder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ncbi_dataset_builder*"]

[tool.setuptools.package-data]
ncbi_dataset_builder = ["README.md", "**/README.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
